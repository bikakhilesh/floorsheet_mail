name: nepse-fundamentals

# The fundamentals snapshot. Logs into npstocks, pulls the saved comparative
# view, and commits reference/fundamentals.csv when it changes.
#
# Runs at 15:30 NPT — after the 15:00 close, before the 16:00 floor sheet chain,
# so the dashboard build downstream always sees the current day's fundamentals
# rather than yesterday's.
#
# It sends no mail. The run summary carries the join result, which is the only
# thing that ever needs attention: if npstocks renames a company, it shows up
# there as unmatched and wants one line in reference/fundamentals_alias.csv.
#
# Secrets: NPSTOCKS_EMAIL, NPSTOCKS_PASSWORD
#   Settings -> Secrets and variables -> Actions -> New repository secret.
#   Nothing else here needs a secret — this workflow does not mail.
#
# Nothing else in the pipeline depends on it. If it fails, the dashboard keeps
# building against the last committed snapshot, which is a day old at worst.

on:
  schedule:
    # 09:45 UTC = 15:30 NPT, Monday-Friday. NEPSE moved off Sun-Thu in Apr 2026.
    - cron: '45 9 * * 1,2,3,4,5'
  workflow_dispatch:
    inputs:
      force:
        description: "Write the csv even if the sanity gates reject the scrape"
        type: boolean
        default: false
      skip_publish:
        description: "Update the snapshot but do not rebuild the dashboard"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nepse-fundamentals
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed:   ${{ steps.scrape.outputs.changed }}
      rows:      ${{ steps.scrape.outputs.rows }}
      unmatched: ${{ steps.scrape.outputs.unmatched }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Credentials reach the script through the environment only. They are
      # never arguments, so they never appear in a process listing, and the
      # script never echoes them.
      - name: Scrape npstocks
        id: scrape
        env:
          NPSTOCKS_EMAIL:    ${{ secrets.NPSTOCKS_EMAIL }}
          NPSTOCKS_PASSWORD: ${{ secrets.NPSTOCKS_PASSWORD }}
        run: |
          python fundamentals_scrape.py \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit the snapshot
        if: steps.scrape.outputs.changed == 'true'
        env:
          MSG: >-
            reference: fundamentals snapshot —
            ${{ steps.scrape.outputs.rows }} companies,
            ${{ steps.scrape.outputs.unmatched }} unmatched
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reference/fundamentals.csv
          if git diff --cached --quiet; then
            echo "Nothing staged after all."
            exit 0
          fi
          git commit -q -m "$MSG"
          git pull --rebase --quiet origin main
          git push -q origin HEAD:main
          echo "Committed $(git rev-parse --short HEAD)."

      - name: Nothing changed
        if: steps.scrape.outputs.changed != 'true'
        run: echo "Fundamentals unchanged — no commit, no rebuild."

  # ──────────────────────────────────────────────────────────────────────
  publish:
    needs: snapshot
    if: >
      needs.snapshot.outputs.changed == 'true' &&
      github.event.inputs.skip_publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Shared with nepse-dashboard and nepse-listed so no two of them can
    # force-push gh-pages at the same moment. They queue.
    concurrency:
      group: floorsheet-dashboard
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch the archive
        id: arch
        run: |
          set -euo pipefail
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if ! git clone --quiet --depth 1 --branch data "$URL" archive; then
            echo "::notice::No data branch yet — nothing to rebuild against."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(ls -1 archive/parquet/*.parquet 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::Archive is empty."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Archive holds $COUNT session(s)."

      # Only data/fundamentals.json and index.html change. The per-day payloads
      # are reused and the join happens in the browser, so this is seconds.
      - name: Rebuild the site
        if: steps.arch.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p site/data
          if git clone --depth 1 --branch gh-pages \
               "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
               site_old 2>/dev/null; then
            cp -r site_old/data/. site/data/ 2>/dev/null || true
          else
            echo "No gh-pages branch yet — building the whole site once."
          fi
          python dashboard_site.py --archive archive/parquet --out site \
            --listed reference/listed_securities.csv \
            --fundamentals reference/fundamentals.csv
          touch site/.nojekyll

      - name: Publish to GitHub Pages
        if: steps.arch.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd site
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan main
          git add -A
          git commit -q -m "Fundamentals refresh — ${{ needs.snapshot.outputs.rows }} companies"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            main:gh-pages
