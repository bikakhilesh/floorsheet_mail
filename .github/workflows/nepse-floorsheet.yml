name: nepse-floorsheet

on:
  schedule:
    # 09:15 UTC = 15:00 NPT (NPT = UTC+5:45). Mon-Fri only.
    # GitHub cron is best-effort and often runs a few minutes late at peak.
    - cron: '15 9 * * 1,2,3,4,5'
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Must exceed VERIFY_BUDGET_SEC in the script (3600s) plus one final
    # scrape + email, with headroom. Script self-limits; this is the backstop.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager beautifulsoup4 lxml pandas

      - name: Run scraper and email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python floorsheet_scrape_and_mail.py
