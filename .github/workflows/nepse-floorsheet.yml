name: nepse-floorsheet

# One job, not two: floorsheet_scrape_and_mail.py writes the CSV to
# tempfile.gettempdir(), which is wiped when the job ends, so nothing
# downstream can read it. The scraper now writes into the workspace via
# OUTPUT_DIR and the analytics, Pages publish and mail run off that file.
#
# Required one-line change in floorsheet_scrape_and_mail.py:
#   OUTPUT_DIR = os.environ.get("OUTPUT_DIR", tempfile.gettempdir())
#
# MAIL_TO is deliberately withheld from the scraper step — it would send its own
# plain-text mail and you would get two a day. The scrape step is allowed to
# fail without stopping the job, so a MISMATCH (which still produces the best
# available CSV) is analysed and mailed with the status in the subject; the job
# is then failed at the end so GitHub still flags it.

on:
  schedule:
    # 10:15 UTC = 16:00 NPT, Monday–Friday.
    # NEPSE moved from a Sunday–Thursday week to Monday–Friday in April 2026:
    # the archive's last Sunday session is 2026-04-05 and its first Friday is
    # 2026-04-10, with no overlap. Running Sun–Thu missed every Friday.
    - cron: '15 10 * * 1,2,3,4,5'
  workflow_dispatch:

permissions:
  contents: write        # force-push the gh-pages site

concurrency:
  group: floorsheet
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Must exceed VERIFY_BUDGET_SEC in the script (3600s) plus one final scrape
    # and email, with headroom for the analytics and publish steps.
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # continue-on-error so a MISMATCH still gets analysed and mailed.
      - name: Scrape floor sheet
        id: scrape
        continue-on-error: true
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data
        run: |
          mkdir -p data
          python floorsheet_scrape_and_mail.py

      # The report must come from THIS run's scrape. --probe reads the trading
      # date out of the contract numbers (the exchange's own numbering, not the
      # filename) and compares it to today in Nepal time. A holiday, a cached
      # page, or a scraper that silently returned the previous session all show
      # up here as fresh=false, and everything downstream is skipped.
      - name: Probe the scraped sheet
        id: probe
        if: always()
        run: |
          CSV=$(ls -1 data/*.csv 2>/dev/null | sort | tail -n 1 || true)
          if [ ! -s "$CSV" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No floor sheet produced — skipping analytics."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "csv=$CSV"   >> "$GITHUB_OUTPUT"
          python interactive_report.py --data "$CSV" --probe | tee /tmp/probe.txt
          grep -E '^(date|fresh|age_days|rows|turnover)=' /tmp/probe.txt >> "$GITHUB_OUTPUT"
          if ! grep -q '^fresh=true' /tmp/probe.txt; then
            echo "::warning::Floor sheet is not the current session — \
          skipping publish and mail. This is expected on a market holiday."
          fi

      - name: Convert the session to parquet
        if: steps.probe.outputs.fresh == 'true'
        run: |
          mkdir -p out
          python interactive_report.py --data "${{ steps.probe.outputs.csv }}" \
            --probe --require-fresh > /dev/null
          python -c "import floorsheet_viz as fv; print(fv.save_parquet(fv.load_floorsheet('${{ steps.probe.outputs.csv }}'), 'out/floorsheet_${{ steps.probe.outputs.date }}.parquet'))"

      # The parquet copy has to outlive the 30-day artifact retention, so it is
      # committed to a `data` branch. Orphan + force-push means the repo carries
      # the current file set once instead of a fresh copy of history every day.
      - name: Archive parquet to the data branch
        if: steps.probe.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git clone --quiet --depth 1 --branch data "$URL" archive; then
            rm -rf archive/.git
          else
            echo "No data branch yet — creating it."
            mkdir -p archive/parquet
          fi
          python floorsheet_archive.py add \
            --file "out/floorsheet_${{ steps.probe.outputs.date }}.parquet" \
            --dir archive/parquet \
            --manifest archive/manifest.csv \
            --readme archive/README.md \
            --repo "https://github.com/${{ github.repository }}.git"
          cd archive
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan main
          git add -A
          git commit -q -m "Floor sheet archive through ${{ steps.probe.outputs.date }}"
          git push -q --force "$URL" main:data

      # The site now spans the whole archive with a day picker, so it is built
      # from archive/parquet rather than today's csv. Per-day JSON is reused
      # from the live site, so only the new session is computed.
      - name: Build the multi-day dashboard site
        if: steps.probe.outputs.fresh == 'true'
        run: |
          mkdir -p site/data
          if git clone --depth 1 --branch gh-pages \
               "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
               site_old 2>/dev/null; then
            cp -r site_old/data/. site/data/ 2>/dev/null || true
          else
            echo "No gh-pages branch yet — building the whole site once."
          fi
          python dashboard_site.py --archive archive/parquet --out site
          touch site/.nojekyll

      - name: Publish to GitHub Pages
        if: steps.probe.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          cd site
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan main
          git add -A
          git commit -q -m "Floor sheet dashboards through $(date -u +%Y-%m-%d)"
          # Orphan + force-push keeps the branch at a single commit, so the repo
          # does not grow by ~0.3 MB of history every trading day.
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            main:gh-pages

      - name: Build charts and send mail
        if: steps.probe.outputs.fresh == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SCRAPE_STATUS: ${{ steps.scrape.outcome == 'success' && 'OK' || 'CHECK SCRAPE' }}
          MPLBACKEND: Agg
        run: |
          python mail_floorsheet.py \
            --data "${{ steps.probe.outputs.csv }}" \
            --outdir out --top 20 --dpi 120 \
            --pages-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Upload analytics pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floorsheet-analytics
          path: |
            out/charts/*.png
            out/tables/*.csv
            out/dashboard_*.html
            out/floorsheet_*.html
            out/*.parquet
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail the job if the scrape did not succeed
        if: steps.scrape.outcome != 'success'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAILED: ${{ steps.probe.outputs.fresh }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, ssl, smtplib
          from email.message import EmailMessage
          u, p = os.environ.get("GMAIL_USER"), os.environ.get("GMAIL_APP_PW")
          to = [x.strip() for x in os.environ.get("MAIL_TO", "").split(",") if x.strip()]
          if os.environ.get("MAILED") == "true":
              print("Analytics mail already went out with the status flagged.")
          elif u and p and to:
              m = EmailMessage()
              m["Subject"] = "[NEPSE Floorsheet FAILED] no floor sheet produced"
              m["From"], m["To"] = u, ", ".join(to)
              m.set_content("The scrape did not produce a CSV, so no analytics "
                            "were generated.\n\n" + os.environ["RUN_URL"] + "\n")
              with smtplib.SMTP_SSL("smtp.gmail.com", 465,
                                    context=ssl.create_default_context()) as s:
                  s.login(u, p)
                  s.send_message(m)
              print("Failure alert sent.")
          else:
              print("Alert skipped: mail secrets not set.")
          PY
          exit 1
